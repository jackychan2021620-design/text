name: ZAOWU Studio Windows Installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'zaowu_studio/**'
      - '.github/workflows/studio-installer.yml'
permissions:
  contents: read
concurrency:
  group: studio-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: zaowu_studio
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development environment and test
        run: ./scripts/setup-windows.ps1
      - name: Package, smoke test, and compile installer
        run: ./scripts/build-windows.ps1
      - name: Surface precise test failures
        if: failure()
        run: |
          @'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('test-results.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  for kind in ('failure','error'):
                      node=case.find(kind)
                      if node is not None:
                          message=(node.text or node.get('message',''))[-6000:]
                          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                          message=message.encode('ascii','backslashreplace').decode('ascii')
                          print('::error title='+case.get('name','Test failure')+'::'+message)
          '@ | & '.\.venv\Scripts\python.exe' -
      - uses: actions/upload-artifact@v4
        with:
          name: ZaowuContentStudio-Windows-Installer
          path: zaowu_studio/dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-build-diagnostics
          path: |
            zaowu_studio/test-results.xml
            zaowu_studio/build/ZaowuContentStudio/warn-ZaowuContentStudio.txt
          if-no-files-found: ignore
  publish-preview:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZaowuContentStudio-Windows-Installer
          path: installer
      - name: Publish downloadable preview installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          run_gh() {
            if output=$(gh "$@" 2>&1); then
              printf '%s\n' "$output"
            else
              output="${output//'%'/'%25'}"
              output="${output//$'\n'/'%0A'}"
              printf '::error title=GitHub release publish::%s\n' "$output"
              return 1
            fi
          }
          tag="studio-preview-${BUILD_SHA}"
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            run_gh release create "$tag" --repo "$GH_REPO" --target "$BUILD_SHA" --prerelease --title "造物手作内容工作台 0.4.0 图文方案版" --notes "Windows x64 安装包。统一入口自动衔接图片识别与 DeepSeek 拍摄发布方案：保留原 DeepSeek Key，首次另配 Qwen 或 OpenAI 视觉 Key 和模型。显示两步进度，图片编码和请求均在后台；失败明确显示，同一窗口修改或重试复用已完成的图片观察。方案按案例保存，可查看上次方案和复制。升级保留原资料。已通过模拟接口回归及 Windows 安装检查；真实视觉服务需有效账号在本机验证，小红书读取仍受平台访问条件影响。"
          fi
          run_gh release upload "$tag" installer/*.exe --repo "$GH_REPO" --clobber
